name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      # Offline by design: the tests parse fixtures and exercise pure functions. Nothing here
      # calls PubMed, iCite, Europe PMC, Tavily or Nebius, so no keys are needed.
      - name: Pytest
        run: pytest

      # Known CVEs in the pinned set. Non-blocking on purpose: a new advisory against a
      # transitive dependency should show up on the next run, not turn every PR red.
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt --desc || true

  web:
    name: Web syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The UI has no build step, so nothing else would notice a syntax error before a user does.
      - run: for f in web/*.js; do node --check "$f"; done

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
